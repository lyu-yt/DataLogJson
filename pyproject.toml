[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-experiment-logger"
version = "0.1.0"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["jsonschema>=4.23,<5", "PySide6>=6.7,<7", "openpyxl>=3.1,<4"]

[project.scripts]
experiment-logger = "experiment_logger.gui:main"
experiment-log = "experiment_logger.cli:main"

[tool.setuptools.packages.find]
include = ["experiment_logger*"]

[tool.setuptools.package-data]
experiment_logger = ["schemas/*.json", "templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
